<!doctype html>
<html lang="en" data-theme="dark">

    <title>Rezelyn</title>
    <link rel="icon" href="assets/avatar.png" type="image/png" />

  </head>

  <body>
    <canvas
      id="background-back"
      style="position: fixed; inset: 0; pointer-events: none; z-index: 0"
    ></canvas>
    <canvas
      id="background"
      style="position: fixed; inset: 0; pointer-events: none; z-index: 1"
    ></canvas>
    <canvas
      id="background-front"
      style="position: fixed; inset: 0; pointer-events: none; z-index: 2"
    ></canvas>
    <div class="cursor">
      <div class="dot"></div>
    </div>

    <button
      class="theme-toggle"
      aria-label="Switch Theme"
      onclick="toggleTheme()"
    >
      <img class="icon-moon" src="assets/moon.png" alt="Moon" />
      <img class="icon-sun" src="assets/sun.png" alt="Sun" />
    </button>

    <div class="cards">
      <div class="card">
        <div class="card-profile">
          <input
            id="mobile-easter-input"
            type="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            aria-hidden="true"
            tabindex="-1"
          />
          <div class="avatar-wrap">
            <img id="avatar" src="/assets/avatar.png" alt="Avatar" />
            <button
              class="mobile-secret-btn"
              aria-hidden="true"
              tabindex="-1"
              onclick="
                document.getElementById('mobile-easter-input').focus();
                const _h = new Audio('assets/audio/nose-honk.mp3');
                _h.volume = 0.25;
                _h.play();
              "
            ></button>
          </div>
          <div class="profile-info">
            <div class="profile-name-row">
              <div class="profile-name">Rezelyn</div>
              <div class="tags-row">
                <span class="flag-wrap" data-tooltip="Transgender"
                  ><img
                    class="flag-badge"
                    src="assets/flags/trans_flag.png"
                    alt="Transgender"
                /></span>
                <span class="flag-wrap" data-tooltip="Omnisexual"
                  ><img
                    class="flag-badge"
                    src="assets/flags/omnisexual_flag.png"
                    alt="Omnisexual"
                /></span>
                <span class="flag-wrap" data-tooltip="Lesbian"
                  ><img
                    class="flag-badge"
                    src="assets/flags/lesbian_flag.png"
                    alt="Lesbian"
                /></span>
              </div>
            </div>
            <div class="tags-row" style="margin-top: 6px">
              <span class="profile-pronouns">she/her</span>
              <span class="profile-pronouns">they/them</span>
            </div>
            <div class="profile-bio">
              transfem, unknown content creator & bad programmer
            </div>
          </div>
        </div>
